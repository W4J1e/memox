<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memoX 首页还原（基于代码）</title>
<style>
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: #2b2b33;
    font-family: "Roboto", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 32px;
  }
  .phone {
    width: 412px; height: 892px;
    background: #FAF8FF; /* ContainerLight / colorSurface */
    border-radius: 36px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  /* Status bar */
  .statusbar {
    height: 32px; flex: 0 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 13px; font-weight: 600; color: #1A1B21;
  }
  .statusbar .right { display: flex; gap: 6px; align-items: center; }
  /* App bar */
  .appbar {
    height: 56px; flex: 0 0 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 0 16px;
  }
  .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -.3px; color: #1A1B21; }
  .appbar .icons { display: flex; gap: 4px; }
  .icon-btn {
    width: 44px; height: 44px; border: none; background: transparent;
    border-radius: 22px; display: grid; place-items: center; cursor: pointer; color: #1A1B21;
  }
  .icon-btn:active { background: rgba(0,0,0,.06); }
  .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
  /* List area */
  .list {
    flex: 1 1 auto; overflow-y: auto; padding: 4px 4px 96px 4px;
  }
  .card {
    background: #FFFFFF; /* colorSurfaceContainerLowest-ish; default note = white w/ stroke */
    border: 1px solid #C6C5D0; /* outlineVariant */
    border-radius: 16px;
    margin: 0 4px 10px 4px;
    padding: 14px 16px 12px 16px;
    box-shadow: none;
  }
  .card.tint { border: none; }
  .card .title {
    font-size: 16px; font-weight: 600; color: #1A1B21;
    margin: 2px 0 6px 0; line-height: 1.3;
  }
  .card .meta {
    font-size: 12.5px; color: #45464F; opacity: .7; margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .reminder-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: #DCE1FF; color: #05164B; border-radius: 16px;
    padding: 3px 10px 3px 8px; font-size: 12px; font-weight: 500;
  }
  .reminder-chip svg { width: 14px; height: 14px; fill: #364479; }
  .card .body {
    font-size: 14px; color: #1A1B21; line-height: 1.5; opacity: .85;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #1A1B21; padding: 1px 0; }
  .box {
    width: 18px; height: 18px; border-radius: 4px; flex: 0 0 18px;
    display: grid; place-items: center; border: 2px solid #7285D0;
  }
  .box.done { background: #7285D0; border-color: #7285D0; }
  .box.done svg { width: 12px; height: 12px; fill: #fff; }
  .check.done span { text-decoration: line-through; opacity: .55; }
  .labels { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .lbl {
    background: #EFEDF4; color: #424659; border-radius: 14px;
    padding: 3px 10px; font-size: 12px;
  }
  /* FAB */
  .fab {
    position: absolute; right: 16px; bottom: 18px;
    width: 56px; height: 56px; border-radius: 16px;
    background: #7285D0; /* primary */
    box-shadow: 0 6px 16px rgba(114,133,208,.5);
    display: grid; place-items: center; cursor: pointer;
  }
  .fab svg { width: 26px; height: 26px; fill: #FFFFFF; }
  /* nav strip reminder */
  .hint { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #9a9aa5; text-align: center; padding: 4px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="right">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="#1A1B21"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="#1A1B21"><path d="M8 2.2C5.5 2.2 3.3 3.2 1.8 4.8L0 6.9l1.8 2.1C3.3 10.6 5.5 11.6 8 11.6s4.7-1 6.2-2.6L16 6.9l-1.8-2.1C12.7 3.2 10.5 2.2 8 2.2zm0 7.4A4.7 4.7 0 1 1 8 3.2a4.7 4.7 0 0 1 0 6.4z"/><circle cx="8" cy="6.4" r="2.2"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="#1A1B21"><rect x="0.5" y="1" width="20" height="10" rx="2.5" stroke="#1A1B21" fill="none"/><rect x="2" y="2.5" width="16" height="7" rx="1" fill="#1A1B21"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="#1A1B21"/></svg>
      </span>
    </div>

    <div class="appbar">
      <div class="wordmark">memoX</div>
      <div class="icons">
        <button class="icon-btn" title="标签">
          <svg viewBox="0 0 24 24"><path d="M3 5h11l7 7-7 7H3z" opacity="0"/></svg>
          <svg viewBox="0 0 24 24" style="position:absolute"><path d="M10.5 3a2 2 0 0 0-1.8 1.1L3 13.2A2 2 0 0 0 4.6 16.3L5 16l4-7 1.2 6.3L8 17h2.2l1.4-7.4 1.6 8.4H16l-2-10.6a2 2 0 0 0-1.9-1.6z"/></svg>
        </button>
        <button class="icon-btn" title="搜索">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <div class="list">
      <!-- Card 1: pastel tint + checkbox body -->
      <div class="card tint" style="background:#FFF8B9;">
        <div class="title">购物清单</div>
        <div class="meta"><span>编辑于 2 小时前</span>
          <span class="reminder-chip"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 3.5 3 6.5 3 9h8c0-2.5 3-5.5 3-9a7 7 0 0 0-7-7zm0 9a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>今天 19:30</span>
        </div>
        <div class="check done"><span class="box done"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span>牛奶 2 盒</span></div>
        <div class="check"><span class="box"></span><span>鸡蛋一打</span></div>
        <div class="check"><span class="box"></span><span>全麦面包</span></div>
        <div class="labels"><span class="lbl">生活</span><span class="lbl">待办</span></div>
      </div>

      <!-- Card 2: default white + body text -->
      <div class="card">
        <div class="title">产品周会纪要</div>
        <div class="meta"><span>编辑于 昨天</span></div>
        <div class="body">确认 v1.0.8 灰度计划：先放 10% 用户，观察崩溃率与 ANR。搜索框抖动问题已修复，待回归。</div>
        <div class="labels"><span class="lbl">工作</span></div>
      </div>

      <!-- Card 3: pastel tint -->
      <div class="card tint" style="background:#B4DED4;">
        <div class="title">读书笔记 · 《深度工作》</div>
        <div class="meta"><span>编辑于 3 天前</span></div>
        <div class="body">关键概念：注意力残留（Attention Residue）。切换任务后，大脑仍停留在上一项任务，降低后续专注度。</div>
        <div class="labels"><span class="lbl">阅读</span></div>
      </div>

      <!-- Card 4: default white + checkbox -->
      <div class="card">
        <div class="title">旅行准备</div>
        <div class="meta"><span>编辑于 上周</span></div>
        <div class="check"><span class="box"></span><span>订机票</span></div>
        <div class="check done"><span class="box done"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg></span><span>办签证</span></div>
        <div class="check"><span class="box"></span><span>酒店预订</span></div>
      </div>

      <!-- Card 5: pastel tint -->
      <div class="card tint" style="background:#F8BBD0;">
        <div class="title">灵感收集</div>
        <div class="meta"><span>编辑于 2 周前</span></div>
        <div class="body">给 memoX 首页加一个「置顶」快捷入口；提醒支持农历；导出 Markdown 时保留勾选状态。</div>
      </div>
    </div>

    <div class="fab" title="记笔记">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </div>
  </div>
</body>
</html>
